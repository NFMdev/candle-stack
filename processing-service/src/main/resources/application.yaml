spring:
  application:
    name: processing-service

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:processing-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      concurrency: 1
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/candlestack}
    username: ${SPRING_DATASOURCE_USERNAME:candlestack_user}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:candlestack}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        '[format_sqL]': true
  
  flyway:
    enabled: true
    locations: classpath:db/migration

candlestack:
  kafka:
    topics:
      market-trades: ${CANDLESTACK_KAFKA_TOPICS_MARKET_TRADES:market-trades}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    '[com.github.nfmdev.candlestack.processing_service]': DEBUG
    '[org.springframework.kafka]': INFO
