
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "generator"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "generator-service:8080"

  - job_name: "ingestion"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "ingestion-service:8081"

  - job_name: "processing"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "processing-service:8082"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"
