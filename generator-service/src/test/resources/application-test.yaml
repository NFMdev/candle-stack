spring:
  main:
    banner-mode: off

generator:
    delivery:
      lanes: 1
      queue-capacity-per-lane: 100
      max-outstanding-payload-bytes: 10000
      shutdownTimeout: PT5M

server:
  port: 0

management:
  endpoints:
    access:
      default: none

logging:
  level:
    root: WARN
    "[com.github.nfmdev.candlestack.generator_service]": WARN