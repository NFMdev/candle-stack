spring:
  application:
    name: generator-service
  jackson:
    # COMMENTED OUT UNTIL CHECK IF FALSE BY DEFAULT
    # datatype:
    #   datetime:
    #     '[WRITE_DATES_AS_TIMESTAMPS]': false
    default-property-inclusion: NON_NULL

generator:
  delivery:
    lanes: 8
    queue-capacity-per-lane: 100
    max-outstanding-payload-bytes: 10000
    shutdownTimeout: PT5M
server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    distribution:
        percentiles-histogram:
          http.server.requests: true
          generator.delivery.duration: true
          generator.delivery.queue.wait: true
          jvm.gc.pause: true

        minimum-expected-value:
            generator.delivery.duration: 1ms
            generator.delivery.queue.wait: 1ms
            jvm.gc.pause: 1ms

        maximum-expected-value:
          generator.delivery.duration: 10s
          generator.delivery.queue.wait: 10s
          jvm.gc.pause: 10s

        slo:
          generator.delivery.duration:
            - 10ms
            - 25ms
            - 50ms
            - 100ms
            - 250ms
            - 500ms
            - 1s
            - 5s
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Candle Stack Generator Service
    version: 0.0.1-SNAPSHOT

logging:
  level:
    root: INFO
    "[com.github.nfmdev.candlestack.generator_service]": INFO
